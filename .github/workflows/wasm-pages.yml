name: Build WASM release

on:
  push:
    branches:
      - wasm
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-release
  cancel-in-progress: false

jobs:
  build:
    name: Build PPSSPP WASM
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build ca-certificates

      - name: Build release
        shell: bash
        run: |
          set -o pipefail
          make wasm-release CMAKE=/usr/bin/cmake WASM_JOBS="-j$(nproc)" 2>&1 | tee build.log

      # Compile errors as annotations, readable from the API without the full log.
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|FAILED:" build.log | sed 's/^[^ ]*\/ppsspp-wasm\///' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-wasm-release
          path: |
            build-wasm-release/PPSSPPSDL.js
            build-wasm-release/PPSSPPSDL.wasm
            build-wasm-release/PPSSPPSDL.data
          if-no-files-found: error

      - name: Upload FFmpeg configure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: build-ffmpeg-wasm/obj/config.log
          if-no-files-found: ignore
